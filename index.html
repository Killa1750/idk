<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Game Stash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .game-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .game-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .game-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .game-desc {
            font-size: 0.8em;
            opacity: 0.9;
        }
        
        .coming-soon {
            background: #ccc !important;
            cursor: not-allowed !important;
            opacity: 0.6;
        }
        
        .coming-soon:hover {
            transform: none !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2) !important;
        }
        
        .footer {
            color: #666;
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Stash</h1>
        <p class="subtitle">Unblocked games - Play anywhere!</p>
        
        <div class="games-grid">
            <a href="games/snake.html" class="game-card">
                <div class="game-icon">🐍</div>
                <div class="game-name">Snake</div>
                <div class="game-desc">Classic snake game</div>
            </a>
            
            <a href="games/2048.html" class="game-card">
                <div class="game-icon">🧩</div>
                <div class="game-name">2048</div>
                <div class="game-desc">Combine tiles</div>
            </a>
            
            <div class="game-card coming-soon">
                <div class="game-icon">🐦</div>
                <div class="game-name">Flappy Bird</div>
                <div class="game-desc">Coming Soon</div>
            </div>
            
            <div class="game-card coming-soon">
                <div class="game-icon">🧱</div>
                <div class="game-name">Tetris</div>
                <div class="game-desc">Coming Soon</div>
            </div>
            
            <div class="game-card coming-soon">
                <div class="game-icon">🎯</div>
                <div class="game-name">Breakout</div>
                <div class="game-desc">Coming Soon</div>
            </div>
            
            <div class="game-card coming-soon">
                <div class="game-icon">🎲</div>
                <div class="game-name">More...</div>
                <div class="game-desc">Coming Soon</div>
            </div>
        </div>
        
        <div class="footer">
            <p>✨ All games saved locally • 🚀 Fast & Responsive • 📱 Works on all devices</p>
        </div>
    </div>
</body>
</html>
