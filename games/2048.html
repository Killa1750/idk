<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }
        
        .info-box {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
        }
        
        .info-box label {
            display: block;
            font-size: 0.9em;
            color: #666;
        }
        
        .info-box .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
            background: #cdc1b4;
            padding: 10px;
            border-radius: 6px;
            margin: 20px auto;
            width: fit-content;
        }
        
        .tile {
            width: 100px;
            height: 100px;
            background: #cdc1b4;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            cursor: default;
        }
        
        .tile.tile-2 { background: #eee4da; color: #776e65; }
        .tile.tile-4 { background: #ede0c8; color: #776e65; }
        .tile.tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile.tile-16 { background: #f59563; color: #f9f6f2; }
        .tile.tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile.tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile.tile-128 { background: #edcf72; color: #095f6b; font-size: 30px; }
        .tile.tile-256 { background: #edcc61; color: #095f6b; font-size: 30px; }
        .tile.tile-512 { background: #edc850; color: #095f6b; font-size: 30px; }
        .tile.tile-1024 { background: #edc53f; color: #095f6b; font-size: 25px; }
        .tile.tile-2048 { background: #edc22e; color: #095f6b; font-size: 25px; }
        .tile.tile-4096 { background: #3c3322; color: #f9f6f2; font-size: 25px; }
        .tile.tile-8192 { background: #3c3322; color: #f9f6f2; font-size: 25px; }
        
        .tile.empty {
            background: #bdac93;
            color: transparent;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .instructions {
            color: #666;
            font-size: 0.9em;
            margin: 20px 0;
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 20px;
        }
        
        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 2048</h1>
        
        <div class="info">
            <div class="info-box">
                <label>Score</label>
                <div class="value" id="score">0</div>
            </div>
            <div class="info-box">
                <label>Best</label>
                <div class="value" id="best">0</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="instructions">
            <p>Use Arrow Keys to move tiles</p>
            <p>Combine tiles with the same number to create larger numbers</p>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="newGame()">New Game</button>
        </div>
        
        <div class="back-btn">
            <a href="../index.html" class="btn">← Back to Menu</a>
        </div>
    </div>
    
    <script>
        let board = [];
        let score = 0;
        
        function loadBest() {
            return parseInt(localStorage.getItem('game2048Best')) || 0;
        }
        
        function saveBest() {
            const current = parseInt(document.getElementById('best').textContent);
            if (score > current) {
                localStorage.setItem('game2048Best', score);
                document.getElementById('best').textContent = score;
            }
        }
        
        function newGame() {
            board = Array(16).fill(0);
            score = 0;
            document.getElementById('score').textContent = score;
            addNewTile();
            addNewTile();
            render();
        }
        
        function addNewTile() {
            const empty = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
            if (empty.length > 0) {
                const idx = empty[Math.floor(Math.random() * empty.length)];
                board[idx] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function render() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            board.forEach(value => {
                const tile = document.createElement('div');
                tile.className = 'tile ' + (value === 0 ? 'empty' : 'tile-' + value);
                tile.textContent = value === 0 ? '' : value;
                gameBoard.appendChild(tile);
            });
        }
        
        function move(direction) {
            let moved = false;
            const oldBoard = [...board];
            
            if (direction === 'left' || direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    const row = board.slice(i * 4, i * 4 + 4);
                    const newRow = slideAndMerge(row, direction === 'right');
                    board.splice(i * 4, 4, ...newRow);
                }
            } else {
                for (let i = 0; i < 4; i++) {
                    const col = [board[i], board[i + 4], board[i + 8], board[i + 12]];
                    const newCol = slideAndMerge(col, direction === 'down');
                    board[i] = newCol[0];
                    board[i + 4] = newCol[1];
                    board[i + 8] = newCol[2];
                    board[i + 12] = newCol[3];
                }
            }
            
            moved = oldBoard.some((val, idx) => val !== board[idx]);
            
            if (moved) {
                addNewTile();
                render();
                document.getElementById('score').textContent = score;
                saveBest();
            }
        }
        
        function slideAndMerge(arr, reverse) {
            if (reverse) arr = arr.reverse();
            arr = arr.filter(val => val !== 0);
            
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            
            while (arr.length < 4) arr.push(0);
            return reverse ? arr.reverse() : arr;
        }
        
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': move('left'); break;
                case 'ArrowRight': move('right'); break;
                case 'ArrowUp': move('up'); break;
                case 'ArrowDown': move('down'); break;
            }
        });
        
        document.getElementById('best').textContent = loadBest();
        newGame();
    </script>
</body>
</html>
